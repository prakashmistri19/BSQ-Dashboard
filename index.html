function card(l,v,s){let q=KPI[l]||KPI['Jobs Received'];return `<div class="card kpi" style="--accent:${q.c};--soft:${q.soft}"><div class="kpi-body"><div class="kpi-top"><div class="kl">${l}</div><div class="kpi-icon"><svg viewBox="0 0 24 24">${q.i}</svg></div></div><div class="kv">${v}</div><div class="ks">${s}</div></div></div>`}function bars(o,gray=''){let e=Object.entries(o),m=Math.max(1,...e.map(x=>n(x[1])));return `<div class="bars">${e.map(([k,v])=>`<div class="bw"><div class="bar ${gray}" style="height:${Math.max(2,n(v)/m*88)}%"><span>${n(v)}</span></div><div class="bl" title="${k}">${k}</div></div>`).join('')}</div>`}
function render(){let d=DATA[current],t=tax.value,s={};Object.entries(d.status).forEach(([k,v])=>s[k]=n(v[t]));let rec=s.Received||0,del=s.Delivered||0,hold=s['On Hold']||0,work=(s.WIP||0)+(s['Under Review']||0)+(s.Review||0),start=s['To be Started']||0,close=n(d.movement.Closing[t]),move={};Object.entries(d.movement).forEach(([k,v])=>move[k]=n(v[t]));let calc=move.Opening+move['Received Today']-move['Delivered Today']-move['Duplicates Removed'];let tat={};if(current==='Overall'){if(t==='Total'){tat={'≤2 Days':n(d.tat['≤2 Days']),'3-4 Days':n(d.tat['3-4 Days']),'>4 Days':n(d.tat['>4 Days'])}}else{let a=DATA.SOW.tat,b=DATA.Karbon.tat;if(t==='VAT')tat={'≤2 Days':n(a['VAT ≤2'])+n(b['VAT ≤2']),'3-4 Days':n(a['VAT 3-4'])+n(b['VAT 3-4']),'>4 Days':n(a['VAT >4'])+n(b['VAT >4'])};else tat={'≤2 Days':n(a['PAYE ≤2'])+n(b['PAYE ≤2']),'3-4 Days':n(a['PAYE 3-4'])+n(b['PAYE 3-4']),'>4 Days':n(a['PAYE >4'])+n(b['PAYE >4'])}}}else{if(t==='VAT')tat={'≤2 Days':n(d.tat['VAT ≤2']),'3-4 Days':n(d.tat['VAT 3-4']),'>4 Days':n(d.tat['VAT >4'])};else if(t==='PAYE')tat={'≤2 Days':n(d.tat['PAYE ≤2']),'3-4 Days':n(d.tat['PAYE 3-4']),'>4 Days':n(d.tat['PAYE >4'])};else tat={'≤2 Days':n(d.tat['VAT ≤2'])+n(d.tat['PAYE ≤2']),'3-4 Days':n(d.tat['VAT 3-4'])+n(d.tat['PAYE 3-4']),'>4 Days':n(d.tat['VAT >4'])+n(d.tat['PAYE >4'])}}content.innerHTML=`<div class="kpis">${card('Jobs Received',rec,'Total received')}${card('Jobs Delivered',del,pc(del,rec)+' delivery rate')}${card('Closing Balance',close,'Pending at day end')}${card('On Hold',hold,'Awaiting action')}${card('Review / WIP',work,'In processing queue')}${card('To Be Started',start,'Not commenced')}</div><div class="grid"><div class="card"><h3>Status Overview <span class="chart-view">${t==='Total'?'Overall':t}</span></h3>${bars(Object.fromEntries(Object.entries(s).filter(([k])=>k!=='Received')))}</div><div class="card"><h3>TAT Ageing <span class="chart-view">${t==='Total'?'Overall':t}</span></h3>${bars(tat,'gray')}</div><div class="card"><h3>Daily Movement <span class="chart-view">${t==='Total'?'Overall':t}</span></h3>${bars(move)}</div><div class="card"><h3>Insights</h3><div class="insight ${del/Math.max(rec,1)>=.75?'good':'warn'}"><div class="insight-icon">${del/Math.max(rec,1)>=.75?'✓':'i'}</div><div class="insight-text"><div class="insight-title">Delivery performance is ${pc(del,rec)}</div><div class="insight-detail">${del} of ${rec} jobs have been delivered. ${del/Math.max(rec,1)>=.75?'Delivered jobs represent the larger share of the received population, with the balance remaining open at the reporting date.':'The remaining share represents jobs that are still open at the reporting date.'}</div></div></div><div class="insight ${close-calc===0?'good':'warn'}"><div class="insight-icon">${close-calc===0?'✓':'i'}</div><div class="insight-text"><div class="insight-title">Closing balance ${close-calc===0?'is fully reconciled':'has a movement variance'}</div><div class="insight-detail">Reported closing balance is ${close}. The movement check difference is ${close-calc}. ${close-calc===0?'Opening, receipts, deliveries and duplicate removals are aligned.':'The reported closing balance differs from the balance calculated through the daily movement.'}</div></div></div><div class="insight ${n(tat['>4 Days'])>0||hold>0?'warn':'good'}"><div class="insight-icon">${n(tat['>4 Days'])>0||hold>0?'i':'✓'}</div><div class="insight-text"><div class="insight-title">${n(tat['>4 Days'])>0?n(tat['>4 Days'])+' jobs are above 4 days':'No jobs are above 4 days'}</div><div class="insight-detail">${hold} jobs are on hold and ${n(tat['3-4 Days'])} jobs are in the 3 to 4 day band. ${n(tat['3-4 Days'])>0?'The 3 to 4 day band represents jobs approaching the above 4 day ageing category.':'There are no jobs in the 3 to 4 day ageing band in the selected view.'}</div></div></div></div></div>`;date.textContent='MIS Date: '+DATA.date+' | '+current+' | '+t}

function cv(a,c){return a[c]==null?0:a[c]}function parse(a){let m=structuredClone(BASE);m.date=XLSX.SSF.format('yyyy-mm-dd',cv(a,'B2'));let cfg=[['SOW','E','F','G',[[4,'Received'],[5,'Delivered'],[6,'On Hold'],[7,'Under Review'],[8,'WIP'],[9,'To be Started']]],['Karbon','R','S','T',[[4,'Received'],[5,'Delivered'],[6,'On Hold'],[7,'Under Review'],[8,'WIP'],[9,'To be Started']]],['Overall','AE','AF','AG',[[4,'Received'],[5,'Delivered'],[6,'On Hold'],[7,'WIP'],[8,'Review'],[9,'To be Started']]]];for(let [name,a1,b1,c1,rs] of cfg){for(let [r,k] of rs)m[name].status[k]={VAT:n(cv(a,a1+r)),PAYE:n(cv(a,b1+r)),Total:n(cv(a,c1+r))};for(let [r,k] of [[11,'Opening'],[12,'Duplicates Removed'],[13,'Received Today'],[14,'Delivered Today'],[15,'Closing']])m[name].movement[k]={VAT:n(cv(a,a1+r)),PAYE:n(cv(a,b1+r)),Total:n(cv(a,c1+r))}}m.Overall.tat={'≤2 Days':n(cv(a,'AI4')),'3-4 Days':n(cv(a,'AJ4')),'>4 Days':n(cv(a,'AK4'))};let tc=[['SOW','I','J','K','L','M','N'],['Karbon','V','W','X','Y','Z','AA']];for(let [nm,a1,b1,c1,d1,e1,f1] of tc)m[nm].tat={'VAT ≤2':n(cv(a,a1+'4')),'PAYE ≤2':n(cv(a,b1+'4')),'VAT 3-4':n(cv(a,c1+'4')),'PAYE 3-4':n(cv(a,d1+'4')),'VAT >4':n(cv(a,e1+'4')),'PAYE >4':n(cv(a,f1+'4'))};return m}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;if(typeof XLSX==='undefined'){alert('Internet is required once to load the Excel reader.');return}let r=new FileReader();r.onload=x=>{let w=XLSX.read(x.target.result,{type:'array',cellDates:false}),sn=w.SheetNames.find(x=>x.trim().toLowerCase()==='synopsis');if(!sn){alert('Synopsis sheet not found.');return}let sh=w.Sheets[sn],a={};Object.keys(sh).filter(k=>k[0]!=='!').forEach(k=>a[k]=sh[k].v);DATA=parse(a);localStorage.setItem('bsqSimple3',JSON.stringify(DATA));render();alert('Dashboard updated from Synopsis sheet.')} ;r.readAsArrayBuffer(f)};function downloadUpdatedDashboard(){

    const blob=new Blob([html],{type:'text/html;charset=utf-8'});

  }catch(err){alert('Unable to create the updated dashboard file.');}
